<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp mời cưới Quỳnh &amp; Văn</title>
<meta name="description" content="Trân trọng kính mời bạn tới dự lễ thành hôn của Quỳnh & Văn – 16:00, Thứ Bảy, 28/11/2026.">
<meta property="og:title" content="Thiệp mời cưới Quỳnh & Văn">
<meta property="og:description" content="16:00, Thứ Bảy, 28/11/2026 – Tân Minh, Ninh Bình">
<meta property="og:image" content="img/p04.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#a96d65; --rose-d:#8a524b; --blush:#f0d9d5; --paper:#fbf7f5; --ink:#6b4440; --muted:#98756f; --line:#e3c9c4;
  --serif:"Playfair Display","Times New Roman",serif; --script:"Allura","Dancing Script",cursive; --sans:"Be Vietnam Pro",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:#1d1a1a;color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
#app{max-width:480px;margin:0 auto;background:var(--paper);overflow:hidden;position:relative}
section{position:relative}
.pad{padding:56px 26px}
.script{font-family:var(--script);font-weight:400;color:var(--rose);line-height:1}
.caps{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-d)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}

/* ===== phong bì ===== */
.env{position:fixed;inset:0;z-index:100;background:#1d1a1a;display:flex;justify-content:center;transition:opacity .9s ease .5s,visibility 0s 1.4s}
.env.gone{opacity:0;visibility:hidden;pointer-events:none}
.env-card{position:relative;width:min(100vw,480px);height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#f3d3d0,#e6b9b6);transition:transform 1.2s cubic-bezier(.6,0,.2,1) .35s}
.env.open .env-card{transform:translateY(105%)}
.env-card::before{content:"";position:absolute;inset:0;opacity:.35;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 1px,transparent 1px 4px)}
.stamps{position:absolute;right:16px;top:0;width:120px;height:120px}
.stamps i{position:absolute;border:3px solid #f4ead8;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.stamps i:nth-child(1){width:46px;height:56px;right:58px;top:0;background:linear-gradient(#7aa28f,#5f8a77)}
.stamps i:nth-child(2){width:50px;height:62px;right:4px;top:0;background:linear-gradient(#b99a52,#8e7236);transform:rotate(3deg)}
.stamps i:nth-child(3){width:48px;height:60px;right:0;top:58px;background:linear-gradient(#d8c79a,#bda76d);transform:rotate(-2deg)}
.env-title{position:absolute;left:0;right:0;top:15%;text-align:center}
.env-title small{display:block;font-size:12px;letter-spacing:.34em;color:var(--rose-d);line-height:1.5}
.env-title .script{font-size:84px;color:var(--rose-d)}
.flap{position:absolute;left:0;right:0;top:34%;height:30%;background:linear-gradient(#ecc3c0,#e9bcb8);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.env-lines{position:absolute;left:0;right:0;top:34%;height:30%;width:100%}
.seal{position:absolute;left:50%;top:calc(34% + 30% - 38px);width:76px;height:76px;margin-left:-38px;border:0;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#e8b27a,#b8763c 60%,#8c5326);box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 0 0 5px rgba(255,220,170,.25);color:#fff4e0;font:400 30px var(--script);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.env-names{position:absolute;left:0;right:0;bottom:11%;text-align:center}
.env-names .script{font-size:50px;color:var(--rose-d)}
.env-names p{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-d);margin-top:6px}
.env-hint{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.18em;color:var(--rose-d);opacity:.8}

/* ===== bìa ===== */
.hero{height:100svh;min-height:560px;max-height:900px;color:#fff;overflow:hidden;background:#2a2020}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:zoom 18s ease-out both}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,20,18,.5),rgba(40,20,18,0) 40%,rgba(40,20,18,.0) 62%,rgba(40,20,18,.55))}
.hero .names{position:absolute;z-index:2;right:24px;top:18%;text-align:right;font-family:var(--serif);font-weight:500;font-size:clamp(46px,14vw,66px);line-height:1;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 22px rgba(0,0,0,.4)}
.hero .names .and{display:block;font-family:var(--script);text-transform:none;font-size:.82em;color:#f6d9d3;margin:-2px 0}
.hero .dt{position:absolute;z-index:2;left:22px;top:max(30px,env(safe-area-inset-bottom) + 20px);text-align:center;font-family:var(--serif);font-size:22px;line-height:1.15}
.hero .dt b{display:block;font-weight:500;font-size:30px;border-bottom:1px solid rgba(255,255,255,.8);padding-bottom:3px;margin-bottom:3px}
.hero .dt span{font-size:18px;letter-spacing:.08em}
.hero .scroll{position:absolute;z-index:2;bottom:26px;left:50%;margin-left:-11px;width:22px;height:36px;border:1.5px solid rgba(255,255,255,.75);border-radius:12px}
.hero .scroll::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:sc 1.8s infinite}
@keyframes sc{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* ===== story ===== */
.story .photo{margin:0 0 0 0;border-bottom-left-radius:140px;overflow:hidden;aspect-ratio:3/3.6}
.story .photo img{width:100%;height:100%;object-fit:cover}
.story .row{display:grid;grid-template-columns:1fr auto;gap:18px;padding:26px 24px 44px;align-items:start}
.story h2{font-family:var(--script);font-weight:400;font-size:46px;color:var(--rose);line-height:1;margin-bottom:8px}
.story p{font-size:13.5px;line-height:1.75;color:var(--ink)}
.bigdate{text-align:center;font-family:var(--serif);color:var(--rose-d);line-height:1.05}
.bigdate b{display:block;font-size:38px;font-weight:500;padding:0 10px 6px;border-bottom:1px solid var(--rose)}
.bigdate b+b{border:0;padding:6px 10px 0}
.bigdate span{display:block;font-size:24px;letter-spacing:.06em;margin-top:6px}

/* ===== lời mời ===== */
.invite .photo{position:relative;aspect-ratio:3/4;overflow:hidden;border-top-left-radius:140px}
.invite .photo img{width:100%;height:100%;object-fit:cover}
.invite .body{padding:28px 24px 0;text-align:right}
.invite .lead{font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1.9;color:var(--rose-d)}
.invite .nm{font-family:var(--serif);font-size:clamp(42px,13vw,58px);line-height:1.04;text-transform:uppercase;color:var(--rose-d);margin-top:14px;font-weight:500}
.invite .nm .and{display:block;font-family:var(--script);text-transform:none;font-size:.95em;color:var(--rose);margin:-4px 0}
.banner{margin:26px 0 0;background:var(--rose);color:#fff;text-align:right;padding:12px 24px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-top-left-radius:30px}
.banner b{display:block;font-weight:500;font-size:15px;margin-top:2px}

/* ===== lịch + địa điểm ===== */
.venue .photo{aspect-ratio:3/3.2;overflow:hidden}
.venue .photo img{width:100%;height:100%;object-fit:cover}
.cal{background:var(--rose);color:#fff;padding:34px 26px 40px;text-align:center}
.cal h3{font-family:var(--script);font-weight:400;font-size:52px;line-height:1}
.cal .lunar{font-size:12px;letter-spacing:.14em;opacity:.9;margin:2px 0 14px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;max-width:330px;margin:0 auto;font-family:var(--serif);font-size:15px}
.cal .grid .h{font-family:var(--sans);font-size:11px;letter-spacing:.1em;opacity:.8;padding-bottom:6px}
.cal .grid .d{height:34px;display:flex;align-items:center;justify-content:center;position:relative}
.cal .grid .d.on{font-weight:600}
.cal .grid .d.on::before{content:"";position:absolute;width:36px;height:36px;border-radius:50%;background:#f6e4e0;z-index:0}
.cal .grid .d.on span{position:relative;z-index:1;color:var(--rose-d)}
.cal .grid .d.on::after{content:"♥";position:absolute;z-index:1;color:#d0605b;font-size:10px;bottom:-5px}
.cal .place{margin-top:28px;font-family:var(--serif);font-size:23px;line-height:1.3}
.cal .place p{font-family:var(--sans);font-size:13.5px;font-weight:300;letter-spacing:.04em;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 24px;font:500 12.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;background:#fff;color:var(--rose-d);box-shadow:0 6px 16px rgba(80,30,25,.25);margin-top:18px}
.pill.fill{background:var(--rose);color:#fff}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:34px 22px 44px;text-align:center}
.fam h4{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:8px;font-weight:600}
.fam p{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.75}
.fam small{display:block;margin-top:6px;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

/* ===== timeline ===== */
.tlsec{padding:34px 0 20px;text-align:center;overflow:hidden}
.tlsec h2{font-family:var(--script);font-weight:400;font-size:50px;color:var(--rose);line-height:1}
.tl{position:relative;margin:10px auto 0}
.tl svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tl .it{position:absolute;width:44%;text-align:center}
.tl .it.l{left:2%}.tl .it.r{right:2%}
.tl .it .t{font-family:var(--serif);font-size:26px;color:var(--rose-d);line-height:1.1}
.tl .it .d{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
.tl .ic{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;color:var(--rose);background:var(--paper);border-radius:50%;display:flex;align-items:center;justify-content:center}
.tl .ic svg{width:34px;height:34px}

/* ===== album ===== */
.album{background:var(--blush);padding:42px 0 30px;text-align:center}
.album h2{font-family:var(--serif);font-weight:400;font-size:40px;color:var(--rose-d);line-height:1.05;letter-spacing:.04em;margin-bottom:16px}
.album h2 em{font-family:var(--script);font-style:normal;font-size:1.25em;color:var(--rose);margin-right:6px}
.album .main{position:relative;margin:0 26px;aspect-ratio:3/4;border-radius:150px 150px 14px 14px;overflow:hidden;background:#fff;cursor:zoom-in}
.album .main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.album .nav{position:absolute;top:50%;z-index:2;border:0;background:rgba(255,255,255,.6);width:34px;height:34px;border-radius:50%;color:var(--rose-d);font-size:20px;cursor:pointer;margin-top:-17px}
.album .nav.p{left:34px}.album .nav.n{right:34px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:14px 26px 4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 58px;height:76px;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;background:none;cursor:pointer;opacity:.7}
.thumbs button.on{border-color:var(--rose);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* ===== cảm ơn / lưu bút / rsvp ===== */
.thanks{padding:46px 24px 10px}
.thanks .box{border:1px solid var(--rose);border-radius:46px 6px 46px 6px;padding:34px 24px 30px;text-align:center}
.thanks h3{font-family:var(--script);font-weight:400;font-size:42px;color:var(--rose);line-height:1.1}
.thanks p{font-size:13px;text-align:justify;text-align-last:center;margin-top:10px;line-height:1.85}
.thanks .sign{font-family:var(--script);font-size:38px;color:var(--rose);margin-top:14px}
.band{background:var(--rose);color:#fff;border-bottom-right-radius:60px;margin-top:40px;padding:34px 24px 40px;text-align:center}
.band h3{font-family:var(--script);font-weight:400;font-size:48px;line-height:1}
.band p.s{font-size:12.5px;margin:6px 0 16px;opacity:.95}
.frm{display:grid;gap:10px;text-align:left}
.frm input[type=text],.frm input[type=tel],.frm textarea{width:100%;border:0;border-radius:6px;padding:11px 12px;font:13.5px var(--sans);color:var(--ink);background:#fff}
.frm textarea{min-height:92px;resize:vertical}
.frm .btn{justify-self:center;border:1px solid #fff;background:transparent;color:#fff;border-radius:6px;padding:9px 26px;font:500 12.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.rsvp{padding:44px 24px 10px}
.rsvp .box{border:1px solid var(--rose);border-radius:6px 46px 6px 46px;padding:30px 22px 28px;text-align:center}
.rsvp h3{font-family:var(--script);font-weight:400;font-size:42px;color:var(--rose);line-height:1.1}
.rsvp p.s{font-size:12.5px;margin:6px 0 16px}
.rsvp .frm input[type=text],.rsvp .frm input[type=tel]{border:1px solid var(--line);background:#fff}
.rsvp .radio{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:4px 0}
.rsvp .radio label{display:flex;gap:8px;align-items:center}
.rsvp .frm .btn{background:var(--rose);border-color:var(--rose)}
.gift-wrap{text-align:center;padding:36px 20px 0}
.count{padding:36px 24px 30px;text-align:center}
.count h3{font-family:var(--script);font-weight:400;font-size:48px;color:var(--rose);line-height:1}
.cd{display:flex;justify-content:center;gap:10px;margin-top:12px;font-family:var(--serif);color:var(--rose-d)}
.cd div{min-width:64px}
.cd b{display:block;font-size:34px;font-weight:500;line-height:1.1}
.cd small{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cd-done{font-family:var(--script);font-size:34px;color:var(--rose);margin-top:10px}
.foot{position:relative;aspect-ratio:3/3.4;overflow:hidden;color:#fff;text-align:center}
.foot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.foot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,25,22,.0) 30%,rgba(60,25,22,.65))}
.foot .tx{position:absolute;z-index:2;left:0;right:0;bottom:22px}
.foot .tx .script{font-size:60px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.foot .tx small{display:block;font-size:11px;letter-spacing:.16em;opacity:.9}

/* ===== modal / lightbox / toast / music ===== */
.modal{position:fixed;inset:0;z-index:60;background:rgba(40,20,18,.7);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.mcard{background:var(--paper);border-radius:22px;max-width:360px;width:100%;padding:24px 20px;text-align:center;position:relative;max-height:92vh;overflow:auto}
.mcard .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:28px;color:var(--rose-d);cursor:pointer}
.mcard p.s{font-size:13px;margin:4px 0 14px}
.qrbox{position:relative;width:min(230px,70%);aspect-ratio:810/1453;margin:6px auto 14px;overflow:hidden;border-radius:18px;box-shadow:0 10px 28px -14px rgba(80,30,25,.6)}
.qrbox img{position:absolute;width:114.07%;max-width:none;left:-7.04%;top:-18.72%}
.mcard img.qr{width:min(240px,70%);margin:6px auto 14px;border-radius:12px}
.mcard .bank{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--rose);font-weight:500}
.mcard .holder{font-family:var(--serif);font-size:21px;color:var(--rose-d)}
.mcard .num{font-family:var(--serif);font-size:28px;letter-spacing:.05em;color:var(--rose-d)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(20,10,10,.94);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:6px}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;padding:14px;line-height:1}
.lb .x{top:6px;right:8px}.lb .p{left:2px;top:50%}.lb .n{right:2px;top:50%}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#3a2623;color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;z-index:120;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.music{position:fixed;right:max(14px,calc(50% - 226px));bottom:16px;z-index:50;width:44px;height:44px;border-radius:50%;border:0;background:rgba(251,247,245,.94);color:var(--rose-d);box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;font-size:18px;display:none}
.music.show{display:block}.music.on{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== editor ===== */
.fab{position:fixed;left:14px;bottom:14px;z-index:90;border:0;border-radius:999px;background:#b58a3c;color:#fff;padding:12px 18px;font:600 14px var(--sans);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.panel{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);z-index:110;background:#fff;color:#222;transform:translateX(-102%);transition:transform .35s;display:flex;flex-direction:column;box-shadow:12px 0 40px rgba(0,0,0,.25)}
.panel.on{transform:none}
.panel header{padding:14px 18px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;font-weight:600}
.panel header button{border:0;background:none;font-size:26px;cursor:pointer;line-height:1}
.panel .scroll{overflow:auto;padding:6px 18px 24px;flex:1}
.panel fieldset{border:0;border-top:1px solid #eee;padding:14px 0 4px;margin-top:8px}
.panel legend{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b58a3c;font-weight:600;padding-right:8px}
.panel label{display:block;font-size:12.5px;color:#666;margin:10px 0 3px}
.panel input[type=text],.panel input[type=url],.panel input[type=datetime-local],.panel textarea,.panel select{width:100%;border:1px solid #d8d8d8;border-radius:8px;padding:9px 10px;font:14px var(--sans);background:#fafafa}
.panel textarea{min-height:76px;resize:vertical}
.panel .row{display:flex;gap:8px;align-items:center}
.panel .row input{flex:1}
.panel .chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:#333}
.panel .mini{border:1px solid #ccc;background:#fff;border-radius:8px;padding:7px 12px;font:13px var(--sans);cursor:pointer}
.panel .mini.pri{background:#8a524b;border-color:#8a524b;color:#fff}
.panel .thumbs2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.panel .th{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;border:2px solid transparent}
.panel .th.hero{border-color:#b58a3c}
.panel .th img{width:100%;height:100%;object-fit:cover}
.panel .th button{position:absolute;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer}
.panel .th .del{top:2px;right:2px;width:20px;height:20px;border-radius:50%}
.panel .th .cov{bottom:0;left:0;right:0;padding:3px}
.panel footer{background:#fafafa;border-top:1px solid #eee;padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:#888;margin-top:6px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="envHost"></div>
<main id="app"></main>
<div class="lb" id="lb"><button class="x" aria-label="Đóng">×</button><button class="p" aria-label="Trước">‹</button><img alt=""><button class="n" aria-label="Sau">›</button></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
